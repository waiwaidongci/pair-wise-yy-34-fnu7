<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工伤事故调查与纠正措施</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}fieldset{margin:.6rem 0;border:1px solid #d5dde3;border-radius:6px}input,select{margin:.2rem;padding:.3rem}.card{border:1px solid #d5dde3;border-radius:6px;padding:.6rem;margin:.5rem 0}.late{color:#b00020;font-weight:600}</style></head><body><h1>工伤事故调查与纠正措施</h1><p>记录工伤经过、伤害、现场和证人，维护调查、纠正措施、验证与关闭流程</p><p>严重度越高、伤害指数越大或未关闭措施越多，优先级越高；严重事故必须在4小时内启动调查。</p><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><h2>证据保管链</h2><p>材料按事故和自编号归档，登记采集人、封存号、载体与存放位置；同一封存号被未结事故占用时登记退回。调阅写明借阅人、用途与归还时限；归还由另一人核对封条与摘要，异常转待核；事故关闭前外借材料须全部归还；原结论更正后原复核失效留档。</p><div><label>操作人 <input id="actor" value="demo"></label><label>角色 <select id="role"><option value="investigator">investigator</option><option value="safety_manager">safety_manager</option><option value="reporter">reporter</option><option value="viewer">viewer</option></select></label><button onclick="loadBoard()">刷新待归还/待核</button></div><div id="board"></div><fieldset><legend>归档登记</legend><input id="evItem" placeholder="事故ID" size="6"><input id="evNo" placeholder="自编号"><input id="evName" placeholder="材料名称"><input id="evCollector" placeholder="采集人"><input id="evSeal" placeholder="封存号"><input id="evMedium" placeholder="载体"><input id="evLoc" placeholder="存放位置"><input id="evDigest" placeholder="摘要"><button onclick="registerEvidence()">登记</button></fieldset><fieldset><legend>调阅</legend><input id="lnEv" placeholder="证据ID" size="6"><input id="lnPurpose" placeholder="用途"><input id="lnHours" placeholder="归还时限(小时)" size="12" value="24"><button onclick="borrow()">借出</button></fieldset><fieldset><legend>归还核对（须另一人操作，请先修改上方操作人）</legend><input id="rtLoan" placeholder="调阅ID" size="6"><label><input type="checkbox" id="rtSeal" checked>封条完好</label><label><input type="checkbox" id="rtDigest" checked>摘要一致</label><button onclick="giveBack()">归还</button></fieldset><fieldset><legend>待核复核</legend><input id="rvEv" placeholder="证据ID" size="6"><input id="rvConclusion" placeholder="复核结论"><button onclick="review()">复核</button></fieldset><fieldset><legend>结论更正（原复核失效留档）</legend><input id="crReview" placeholder="复核ID" size="6"><input id="crConclusion" placeholder="更正后结论"><button onclick="correct()">更正</button></fieldset><pre id="custodyOut"></pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
function hdr(){return{'Content-Type':'application/json','X-Actor':document.getElementById('actor').value,'X-Role':document.getElementById('role').value}}
function show(o){document.getElementById('custodyOut').textContent=JSON.stringify(o,null,2)}
async function loadBoard(){const r=await fetch('/api/custody/pending',{headers:hdr()});const data=await r.json();show(data);const el=document.getElementById('board');el.innerHTML='';const rows=data.board||[];if(!rows.length){el.textContent='暂无待归还或待核材料';return}rows.forEach(function(it){const div=document.createElement('div');div.className='card';let h='<b>#'+it.item_id+' '+it.title+'</b>（'+it.status+'）';if(it.pending_returns.length){h+='<div>待归还：<ul>';it.pending_returns.forEach(function(l){h+='<li>'+l.evidence_no+' '+l.name+' — 借阅人 '+l.borrower+'，期限 '+l.due_at+(l.overdue?' <span class="late">已逾期</span>':'')+'</li>'});h+='</ul></div>'}if(it.pending_reviews.length){h+='<div>待核：<ul>';it.pending_reviews.forEach(function(e){h+='<li>'+e.evidence_no+' '+e.name+' — 封存号 '+e.seal_no+'，转待核于 '+e.since+'</li>'});h+='</ul></div>'}div.innerHTML=h;el.appendChild(div)})}
async function registerEvidence(){const body={evidence_no:evNo.value,name:evName.value,collector:evCollector.value,seal_no:evSeal.value,medium:evMedium.value,location:evLoc.value,digest:evDigest.value};const r=await fetch('/api/items/'+evItem.value+'/evidence',{method:'POST',headers:hdr(),body:JSON.stringify(body)});show(await r.json());loadBoard()}
async function borrow(){const h=parseFloat(lnHours.value||'24');const body={purpose:lnPurpose.value,due_at:new Date(Date.now()+h*3600*1000).toISOString()};const r=await fetch('/api/evidence/'+lnEv.value+'/loans',{method:'POST',headers:hdr(),body:JSON.stringify(body)});show(await r.json());loadBoard()}
async function giveBack(){const body={seal_intact:rtSeal.checked,digest_match:rtDigest.checked};const r=await fetch('/api/loans/'+rtLoan.value+'/return',{method:'POST',headers:hdr(),body:JSON.stringify(body)});show(await r.json());loadBoard()}
async function review(){const r=await fetch('/api/evidence/'+rvEv.value+'/reviews',{method:'POST',headers:hdr(),body:JSON.stringify({conclusion:rvConclusion.value})});show(await r.json());loadBoard()}
async function correct(){const r=await fetch('/api/reviews/'+crReview.value+'/correct',{method:'POST',headers:hdr(),body:JSON.stringify({conclusion:crConclusion.value})});show(await r.json())}</script></body></html>
