<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工伤事故调查与纠正措施</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}section{margin-top:2rem}.card{border:1px solid #d7dee4;border-radius:8px;padding:.75rem 1rem;margin:.75rem 0}.card h3{margin:.25rem 0 .5rem}.overdue{color:#b3261e;font-weight:600}</style></head><body><h1>工伤事故调查与纠正措施</h1><p>记录工伤经过、伤害、现场和证人，维护调查、纠正措施、验证与关闭流程</p><p>严重度越高、伤害指数越大或未关闭措施越多，优先级越高；严重事故必须在4小时内启动调查。</p><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><section><h2>证据保管链</h2><p>归档登记采集人、封存号、载体与存放位置；调阅记录借阅人、用途与归还时限；归还由借阅人之外的人核对封条与摘要，异常转待核；事故关闭前外借材料须全部归还，结论更正后原复核失效留档。</p><button onclick="loadCustody()">刷新保管链看板</button><div id="custody"></div></section><script>function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
async function loadCustody(){const r=await fetch('/api/custody',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const data=await r.json();const root=document.getElementById('custody');const board=data.board||[];
if(!board.length){root.innerHTML='<p>暂无待归还或待核材料。</p>';return}
root.innerHTML=board.map(function(row){const ret=row.pending_returns.map(function(e){return '<li>'+esc(e.evidence_no)+'《'+esc(e.title)+'》 借阅人:'+esc(e.borrower)+' 用途:'+esc(e.purpose)+' 归还时限:'+esc(e.due_at)+(e.overdue?' <span class="overdue">已逾期</span>':'')+'</li>'}).join('');const rev=row.pending_reviews.map(function(e){return '<li>'+esc(e.evidence_no)+'《'+esc(e.title)+'》 封存号:'+esc(e.seal_no)+'</li>'}).join('');return '<div class="card"><h3>#'+row.item_id+' '+esc(row.title)+'（'+esc(row.status)+'）</h3>'+(ret?'<b>待归还</b><ul>'+ret+'</ul>':'')+(rev?'<b>待核</b><ul>'+rev+'</ul>':'')+'</div>'}).join('')}</script></body></html>
